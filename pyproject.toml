[project]
name = "bws4"
version = "1.1.0"
description = "Built with Spec4 (BWS4) example apps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi>=0.140.0",
    "httpx>=0.28.1",
    "litellm>=1.93.0",
    "numpy>=2.5.1",
    "pgvector>=0.5.0",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.21.0",
    "pydantic-settings>=2.14.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.1",
    "sentry-sdk>=2.66.1",
    "sqlalchemy>=2.0.51",
    "sse-starlette>=3.4.6",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "torch>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

# The live smoke run is developer-invoked and deselected by default. A suite
# that calls live models passes on a laptop and fails in CI the day a slug is
# rate-limited or withdrawn, and a gate that fails for reasons unrelated to the
# change is one people learn to ignore. Everything that gates the build runs on
# recorded fixtures; run the smoke pass deliberately with `-m live`.
addopts = "-m 'not live'"
markers = [
  "live: reaches real model providers and real Exa. Opt in with `-m live`.",
]

# Ruff and mypy arrive in v5 against a backend that has never had either. Both
# are therefore scoped deliberately: the gate applies to code this revision
# writes, and the four already-shipped example apps are left alone. Widening it
# is a change worth making on purpose, not a side effect of adding a linter --
# a repo-wide reformat would bury this revision's diff in whitespace.
[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pep8-naming (the snake_case/PascalCase/
# UPPER_SNAKE_CASE conventions this project already follows by hand),
# flake8-bugbear, pyupgrade, and the blind-except rule `main.py` already
# suppresses by name.
select = ["E", "F", "I", "N", "B", "UP", "BLE"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in an argument default is not a mutable-default bug -- it is
# how FastAPI declares dependencies, and every router in this repo uses it.
# Telling bugbear the call is immutable is the documented fix; blanket-ignoring
# B008 would also hide the real version of this mistake.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
# Strict over the whole backend, with no exclusions. v10 Phase 5 removed the
# per-module `ignore_errors` overrides that exempted the pre-v5 slices (api,
# chained_calls, core, db, embeddings, planning, rag, single_call, tools,
# services and main) and fixed what they had been hiding, so a new module is
# covered by default and there is no exemption list to keep honest.
strict = true
# `backend` rather than `backend/app` + `backend/tests`, so nothing under the
# package -- the test tree included -- can drop out of the checked set. A gate
# nobody runs by default is a gate that decays.
files = ["backend"]

[[tool.mypy.overrides]]
# The one third-party stub gap left: scikit-learn ships neither stubs nor a
# py.typed marker. litellm, sentence-transformers and pgvector used to be
# listed here too; all three now ship py.typed, so their entries were dropped
# in v10 Phase 5 rather than kept as silent cover.
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
