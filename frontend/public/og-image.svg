<?xml version="1.0" encoding="UTF-8"?>
<!--
  Built with Spec4 AI - https://spec4.ai

  Source for the 1200x630 social card referenced by og:image and twitter:image.
  Social crawlers do not render SVG in a link preview, so this has to be
  rasterised to public/og-image.png before those tags resolve:

      rsvg-convert -w 1200 -h 630 og-image.svg > og-image.png
      # or:  magick -background none og-image.svg -resize 1200x630 og-image.png
      # or:  inkscape og-image.svg -w 1200 -h 630 -o og-image.png

  Palette matches the app's dark theme (gray-950 ground, gray-100 text,
  violet-400 accent), so a shared link looks like the page it opens.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)" />
  <rect x="0" y="0" width="1200" height="6" fill="#a78bfa" />

  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">
    <text x="80" y="150" font-size="26" fill="#a78bfa" letter-spacing="3">BUILT WITH SPEC4</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="80" y="258" font-size="66" font-weight="600" fill="#f3f4f6">
      A working gallery of
    </text>
    <text x="80" y="338" font-size="66" font-weight="600" fill="#f3f4f6">
      AI application patterns
    </text>
    <text x="80" y="410" font-size="30" fill="#9ca3af">
      Nine example apps. Open one and watch the pattern actually run.
    </text>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="21" fill="#6b7280">
    <text x="80" y="500">embeddings · single-call · RAG · tool use · chained calls</text>
    <text x="80" y="536">planning agent · orchestrated subagents · collaboration · ReAct</text>
  </g>

  <g font-family="ui-monospace, 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace">
    <text x="80" y="586" font-size="22" fill="#a78bfa">bw.spec4.ai</text>
  </g>
</svg>
